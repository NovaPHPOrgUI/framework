<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova UI Demo · 前台 M3</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    :root {
      --primary: #006a60; --on-primary: #fff; --primary-c: #9ef2e4; --on-primary-c: #00201c;
      --surface: #f4fbf8; --on-surface: #161d1c; --on-variant: #3f4946;
      --container-low: #eff5f2; --outline: #6f7976;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans SC", system-ui, sans-serif; background: var(--surface); color: var(--on-surface); }
    .ms { font-family: "Material Symbols Rounded"; font-size: 22px; vertical-align: middle; }
    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 12px;
      min-height: 64px; padding: 0 24px;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
    }
    .bar.elev { border-bottom-color: rgba(22,29,28,.08); background: var(--container-low); }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--primary-c); color: var(--on-primary-c); display: grid; place-items: center; font-weight: 700; }
    .brand-title { font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; }
    .desktop-nav { display: flex; gap: 4px; margin-left: 24px; }
    .nav-btn { height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font: inherit; color: var(--on-variant); cursor: pointer; }
    .nav-btn:hover, .nav-btn.active { background: rgba(0,106,96,.1); color: var(--primary); }
    .spacer { flex: 1; }
    .cta { height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
    .mobile-nav { display: none; }
    .hero {
      max-width: 1080px; margin: 32px auto; padding: 48px 24px;
      border-radius: 28px; background: var(--container-low);
      animation: enter .4s var(--ease) both;
    }
    .hero h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 3vw, 2.6rem); font-weight: 600; line-height: 1.2; }
    .hero p { margin: 0 0 24px; color: var(--on-variant); max-width: 36rem; line-height: 1.55; }
    .grid { max-width: 1080px; margin: 0 auto 48px; padding: 0 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { padding: 20px; border-radius: 20px; background: var(--container-low); transition: transform .2s var(--ease); }
    .card:hover { transform: translateY(-3px); }
    .card h3 { margin: 0 0 8px; font-size: 1rem; font-weight: 600; }
    .card p { margin: 0; color: var(--on-variant); font-size: .9rem; line-height: 1.45; }
    .back { display: inline-block; margin: 12px 24px 0; font-size: .85rem; color: var(--primary); }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (max-width: 900px) {
      .desktop-nav { display: none; }
      .mobile-nav { display: flex; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Demo 目录</a>
  <header class="bar" id="bar">
    <a class="brand" href="#"><div class="logo">N</div><span class="brand-title">Nova Site</span></a>
    <nav class="desktop-nav">
      <button class="nav-btn active" type="button">首页</button>
      <button class="nav-btn" type="button">产品</button>
      <button class="nav-btn" type="button">文档</button>
      <button class="nav-btn" type="button">关于</button>
    </nav>
    <button class="mobile-nav icon" type="button" style="border:0;background:none;margin-left:auto"><span class="ms">menu</span></button>
    <div class="spacer desktop-nav"></div>
    <button class="cta desktop-nav" type="button">开始使用</button>
  </header>
  <section class="hero">
    <h1>前台壳：品牌在顶栏，导航跟内容走</h1>
    <p>对应框架 <code>layout2.tpl</code>：logo + brand-title + desktop-nav / mobile-nav。适合官网、文档站、登录后的轻前台。</p>
    <button class="cta" type="button">主操作</button>
  </section>
  <div class="grid">
    <div class="card"><h3>Surface 层级</h3><p>用 surface-container-low 做区块，而不是到处加阴影卡片。</p></div>
    <div class="card"><h3>响应式导航</h3><p>宽屏桌面导航，窄屏收进菜单按钮——layout.scss 已接线。</p></div>
    <div class="card"><h3>动效克制</h3><p>首屏 rise + 卡片 lift，尊重 prefers-reduced-motion。</p></div>
  </div>
  <script>
    const bar = document.getElementById('bar');
    window.addEventListener('scroll', () => bar.classList.toggle('elev', scrollY > 4), { passive: true });
  </script>
</body>
</html>
