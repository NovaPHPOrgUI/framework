<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova UI Demo · 高密度后台</title>
  <style>
    :root {
      --bg: #f5f5f5; --panel: #fff; --ink: #1a1a1a; --muted: #666;
      --line: #e6e6e6; --primary: #1565c0; --sidebar: 200px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.4 "Noto Sans SC", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
    .side { background: #111; color: #ddd; padding: 12px 0; }
    .side .brand { padding: 8px 16px 16px; font-weight: 700; letter-spacing: .04em; color: #fff; }
    .side a { display: block; padding: 8px 16px; color: #bbb; text-decoration: none; }
    .side a:hover, .side a.on { background: #222; color: #fff; }
    .side .g { padding: 12px 16px 4px; font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: .08em; }
    .main { min-width: 0; }
    .top { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .top h1 { margin: 0; font-size: 14px; font-weight: 600; }
    .top .sp { flex: 1; }
    .btn { height: 28px; padding: 0 10px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; font: inherit; }
    .btn.p { background: var(--primary); color: #fff; border-color: var(--primary); }
    .body { padding: 12px; }
    .tools { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    input[type=search] { height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); font-size: 12px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { background: #fafafa; color: var(--muted); font-weight: 600; }
    tr:hover td { background: #f7faff; }
    .pill { display: inline-block; padding: 1px 6px; border-radius: 3px; background: #e3f2fd; color: #1565c0; font-size: 11px; }
    .back { display: inline-block; margin: 8px 12px; font-size: 12px; color: var(--primary); }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Demo 目录</a>
  <div class="app">
    <aside class="side">
      <div class="brand">NOVA · OPS</div>
      <div class="g">Monitor</div>
      <a class="on" href="#">Dashboard</a>
      <a href="#">Jobs</a>
      <a href="#">Logs</a>
      <div class="g">System</div>
      <a href="#">Config</a>
      <a href="#">Users</a>
    </aside>
    <div class="main">
      <header class="top"><h1>Jobs</h1><div class="sp"></div><button class="btn" type="button">Refresh</button><button class="btn p" type="button">New job</button></header>
      <div class="body">
        <div class="tools">
          <input type="search" placeholder="Filter…" />
          <button class="btn" type="button">Status ▾</button>
          <button class="btn" type="button">Export</button>
        </div>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Queue</th><th>Status</th><th>Updated</th></tr></thead>
          <tbody>
            <tr><td>1042</td><td>sync-books</td><td>default</td><td><span class="pill">running</span></td><td>2m ago</td></tr>
            <tr><td>1041</td><td>ai-classify</td><td>ai</td><td><span class="pill">ok</span></td><td>18m ago</td></tr>
            <tr><td>1040</td><td>cover-scrape</td><td>io</td><td><span class="pill">ok</span></td><td>1h ago</td></tr>
            <tr><td>1039</td><td>webdav-pull</td><td>default</td><td><span class="pill">ok</span></td><td>3h ago</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
